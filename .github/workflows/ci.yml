name: CI KampusLMS

on:
  push:
    branches: [ main, dev, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Copy .env.example to .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Check .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env file is tracked in git!"
            exit 1
          else
            echo "PASS: .env file is not tracked in git."
          fi

      - name: Setup SQLite Database for CI
        run: |
          touch database/database.sqlite
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/g' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/g' .env

      - name: Run Migrations & Seeder (migrate:fresh --seed)
        run: php artisan migrate:fresh --seed --force

      - name: Verify Reversible Migrations (migrate:refresh)
        run: php artisan migrate:refresh --force

      - name: Run Tests
        run: php artisan test
