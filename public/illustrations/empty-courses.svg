<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Background subtle glow -->
  <circle cx="200" cy="150" r="110" fill="#F1F5F9"/>
  <circle cx="270" cy="110" r="45" fill="#E2E8F0" opacity="0.6"/>
  <circle cx="130" cy="190" r="30" fill="#E2E8F0" opacity="0.4"/>

  <!-- Floating decorative element: Mint Star -->
  <path d="M100 80 L104 90 L114 94 L104 98 L100 108 L96 98 L86 94 L96 90 Z" fill="#5DD299" opacity="0.9"/>
  <!-- Floating decorative element: Amber Dot -->
  <circle cx="310" cy="75" r="8" fill="#FFC152"/>
  <circle cx="90" cy="170" r="5" fill="#FE774C"/>
  <circle cx="320" cy="200" r="6" fill="#66A7F2" opacity="0.8"/>

  <!-- Base Table / Shelf surface -->
  <path d="M70 230 L330 230" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>

  <!-- Books Stack -->
  <!-- Bottom Book (Dark) -->
  <rect x="130" y="195" width="140" height="24" rx="5" fill="#1E1E26"/>
  <rect x="140" y="200" width="120" height="4" rx="2" fill="#363644"/>
  <rect x="130" y="195" width="16" height="24" rx="3" fill="#66A7F2"/>

  <!-- Middle Book (Sky Blue) -->
  <rect x="145" y="165" width="125" height="22" rx="5" fill="#66A7F2"/>
  <rect x="155" y="171" width="105" height="3" rx="1.5" fill="#FFFFFF" opacity="0.7"/>
  <rect x="145" y="165" width="14" height="22" rx="3" fill="#FE774C"/>

  <!-- Top Book (Mint) -->
  <rect x="160" y="138" width="105" height="20" rx="4" fill="#5DD299"/>
  <rect x="160" y="138" width="12" height="20" rx="3" fill="#1E1E26"/>

  <!-- Graduation Cap (Toga) on Top -->
  <!-- Cap diamond -->
  <polygon points="200,85 260,105 200,125 140,105" fill="#1E1E26"/>
  <polygon points="200,90 250,105 200,120 150,105" fill="#252530"/>
  <!-- Cap skull base -->
  <path d="M165 115 Q200 135 235 115 L235 130 Q200 150 165 130 Z" fill="#1E1E26"/>
  <!-- Tassel ribbon -->
  <circle cx="200" cy="105" r="4" fill="#FFC152"/>
  <path d="M200 105 Q245 110 248 135" stroke="#FFC152" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="244" y="135" width="8" height="12" rx="2" fill="#FFC152"/>

  <!-- Open Bookmark ribbon -->
  <path d="M225 187 L225 215 L232 210 L239 215 L239 187 Z" fill="#FE774C"/>
</svg>
